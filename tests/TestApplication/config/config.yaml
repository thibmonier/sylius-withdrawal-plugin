imports:
    - { resource: "@TmonierSyliusWithdrawalPlugin/config/config.yaml" }

tmonier_sylius_withdrawal:
    rate_limit:
        per_ip: 4
        per_email: 2
        cache_pool: cache.tmonier_withdrawal_limiter

framework:
    cache:
        pools:
            # Filesystem (an array pool is reset between requests); cleared by every functional test.
            cache.tmonier_withdrawal_limiter:
                adapter: cache.adapter.filesystem

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

# Remove if you do not need to extend entities
doctrine:
    orm:
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                        prefix: Tests\Tmonier\SyliusWithdrawalPlugin
