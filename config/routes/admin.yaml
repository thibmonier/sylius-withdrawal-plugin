tmonier_withdrawal_admin_withdrawal_request_index:
    path: /withdrawal-requests
    methods: [GET]
    defaults:
        _controller: tmonier_withdrawal.controller.withdrawal_request::indexAction
        _sylius:
            section: admin
            permission: true
            template: "@SyliusAdmin/shared/crud/index.html.twig"
            grid: tmonier_withdrawal_admin_withdrawal_request
            vars:
                hook_prefix: tmonier_withdrawal.admin.withdrawal_request

tmonier_withdrawal_admin_withdrawal_request_show:
    path: /withdrawal-requests/{id}
    methods: [GET]
    defaults:
        _controller: tmonier_withdrawal.controller.withdrawal_request::showAction
        _sylius:
            section: admin
            permission: true
            template: "@SyliusAdmin/shared/crud/show.html.twig"
            vars:
                hook_prefix: tmonier_withdrawal.admin.withdrawal_request

tmonier_withdrawal_admin_withdrawal_request_accept:
    path: /withdrawal-requests/{id}/accept
    methods: [PUT]
    defaults:
        _controller: tmonier_withdrawal.controller.withdrawal_request::applyStateMachineTransitionAction
        _sylius:
            section: admin
            permission: true
            state_machine:
                graph: tmonier_withdrawal_request
                transition: accept
            redirect: referer
            flash: tmonier_withdrawal.withdrawal_request.accept

tmonier_withdrawal_admin_withdrawal_request_reject:
    path: /withdrawal-requests/{id}/reject
    methods: [PUT]
    defaults:
        _controller: tmonier_withdrawal.controller.withdrawal_request::applyStateMachineTransitionAction
        _sylius:
            section: admin
            permission: true
            state_machine:
                graph: tmonier_withdrawal_request
                transition: reject
            redirect: referer
            flash: tmonier_withdrawal.withdrawal_request.reject
